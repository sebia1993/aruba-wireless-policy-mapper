[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlc-role-acl-collector"
version = "0.2.0"
description = "Collect Aruba AOS8 WLC SSID, role, and ACL mappings and generate Excel/HTML reports."
requires-python = ">=3.11"
dependencies = [
  "customtkinter>=5.2",
  "netmiko>=4.0",
  "openpyxl>=3.1",
  "paramiko>=2.9.5",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "cyclonedx-bom>=7.0",
  "pip-audit>=2.9",
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "setuptools>=68",
  "streamlit>=1.36",
  "wheel>=0.45",
]
web = [
  "streamlit>=1.36",
]

[project.scripts]
wlc-role-acl-collector = "wlc_role_acl_collector.cli:main"
wlc-role-acl-gui = "wlc_role_acl_collector.gui_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wlc_role_acl_collector = [
  "static/*.js",
  "static/*.txt",
]
