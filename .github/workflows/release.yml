name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Create release metadata
        id: metadata
        shell: pwsh
        run: |
          $projectName = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])"
          $kst = [System.TimeZoneInfo]::FindSystemTimeZoneById("Korea Standard Time")
          $kstNow = [System.TimeZoneInfo]::ConvertTime([System.DateTimeOffset]::UtcNow, $kst)
          $baseTag = "v{0}" -f $kstNow.ToString("yyyy.MM.dd-HHmmss")
          $candidate = $baseTag
          $counter = 1

          while ($true) {
            $existingTag = git ls-remote --tags origin "refs/tags/$candidate"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to check existing remote tags."
            }
            if (-not $existingTag) {
              break
            }
            $candidate = "$baseTag-$counter"
            $counter += 1
          }

          $assetName = "${projectName}_${candidate}_windows.zip"
          "project_name=$projectName" >> $env:GITHUB_OUTPUT
          "tag=$candidate" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Run validation
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\validate.ps1

      - name: Build Windows release package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_gui_exe.ps1

      - name: Verify Windows release package
        shell: pwsh
        run: python .\tools\verify_release_package.py --dist .\dist --smoke-cli

      - name: Build Streamlit portable package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_streamlit_portable.ps1

      - name: Verify Streamlit portable package
        shell: pwsh
        run: python .\tools\verify_streamlit_portable_package.py --dist .\dist --smoke

      - name: Build combined Windows package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_combined_release.ps1

      - name: Verify combined Windows package
        shell: pwsh
        run: python .\tools\verify_combined_release_package.py --dist .\dist --smoke

      - name: Prepare release asset
        id: assets
        shell: pwsh
        run: |
          $assetDir = Join-Path $PWD "release_assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $sourceZip = Get-ChildItem -Path ".\dist" -Filter "WlcRoleAclCollectorWindows_*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $sourceZip) {
            throw "No combined Windows release zip was generated in dist."
          }

          $assetName = "${{ steps.metadata.outputs.asset_name }}"
          $assetPath = Join-Path $assetDir $assetName
          Copy-Item -LiteralPath $sourceZip.FullName -Destination $assetPath -Force

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT
          "checksum=$hash" >> $env:GITHUB_OUTPUT

      - name: Verify final release asset
        shell: pwsh
        run: |
          python .\tools\verify_combined_release_package.py `
            --zip "${{ steps.assets.outputs.asset_path }}" `
            --expected-sha256 "${{ steps.assets.outputs.checksum }}" `
            --smoke

      - name: Create Korean release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.metadata.outputs.tag }}"
          $projectName = "${{ steps.metadata.outputs.project_name }}"
          $assetName = "${{ steps.metadata.outputs.asset_name }}"
          $checksum = "${{ steps.assets.outputs.checksum }}"
          $sha = "${{ github.sha }}"
          $branch = "${{ github.ref_name }}"

          $previousTag = $null
          git describe --tags --abbrev=0 HEAD^ *> $null
          if ($LASTEXITCODE -eq 0) {
            $previousTag = (git describe --tags --abbrev=0 HEAD^).Trim()
          }
          $global:LASTEXITCODE = 0

          if ($previousTag) {
            $range = "$previousTag..$sha"
            $commitLines = @(git log --pretty=format:"- %h %s" $range)
            $changedFiles = @(git diff --name-only $range)
          } else {
            $range = "최근 커밋"
            $commitLines = @(git log --pretty=format:"- %h %s" -n 20 $sha)
            $changedFiles = @(git show --pretty="" --name-only $sha)
          }

          if (-not $commitLines) {
            $commitLines = @("- 변경 커밋을 자동으로 찾지 못했습니다.")
          }
          $commitText = $commitLines -join [Environment]::NewLine

          $areas = New-Object System.Collections.Generic.List[string]
          function Add-Area([string] $text) {
            if (-not $script:areas.Contains($text)) {
              $script:areas.Add($text)
            }
          }

          foreach ($file in $changedFiles) {
            if ($file -like "src/wlc_role_acl_collector/*") {
              Add-Area "- 수집/분석: WLC 수집, Parser, Role/ACL 평가 또는 보고서 로직이 변경되었습니다."
            } elseif ($file -eq "app.py") {
              Add-Area "- 웹앱: Streamlit 화면 또는 실행 흐름이 변경되었습니다."
            } elseif ($file -like "tests/*") {
              Add-Area "- 검증: 자동 회귀 테스트가 추가 또는 변경되었습니다."
            } elseif ($file -like "config/*") {
              Add-Area "- 샘플/설정: 배포에 포함되는 비식별 샘플 또는 설정 구조가 변경되었습니다."
            } elseif ($file -like "docs/*" -or $file -eq "README.md") {
              Add-Area "- 문서: 운영/검증/사용 문서가 변경되었습니다."
            } elseif ($file -like ".github/workflows/*" -or $file -like "*.ps1" -or $file -like "tools/*") {
              Add-Area "- 배포/도구: Windows 빌드, 검증 또는 Release 자동화가 변경되었습니다."
            }
          }
          if ($areas.Count -eq 0) {
            Add-Area "- 기타: 저장소 변경 사항이 포함되어 있습니다."
          }
          $areaText = $areas -join [Environment]::NewLine

          $notesPath = Join-Path $PWD "release_notes.md"
          $notes = @"
          # $projectName $tag

          Aruba AOS8 WLC의 SSID·AAA Profile·Role·ACL·Alias 관계를 수집·분석하는 Windows 배포본입니다.

          ## 이번 릴리즈
          $areaText

          ## 운영 영향
          - 장비 설정을 변경하는 기능은 추가하지 않습니다.
          - 실제 운영망 정보는 Release asset이나 Release notes에 포함하지 않습니다.
          - GUI, CLI, 로컬 Streamlit 웹앱을 하나의 Windows 통합 ZIP으로 제공합니다.
          - 기존 결과를 사용할 때는 `정상 완료 / 부분 완료 / 수집 실패` 상태와 영향 Role/SSID를 함께 확인하십시오.

          ## 검증 결과
          - 기준 커밋: `$sha`
          - 브랜치: `$branch`
          - `tools\validate.ps1` 통과
          - Windows GUI/CLI 패키지 빌드 및 smoke 검증
          - Streamlit portable 패키지 빌드 및 smoke 검증
          - GUI + Web 통합 ZIP 빌드 및 SHA-256 검증

          ## 다운로드
          - 일반 사용자용: `$assetName`
          - SHA-256: `$checksum`
          - GUI: ZIP 압축 해제 후 `gui\WlcRoleAclCollectorGUI.exe`
          - 웹앱: ZIP 압축 해제 후 `web\start_webapp.cmd`
          - GitHub의 `Source code (zip)` / `Source code (tar.gz)`는 실행용 배포 파일이 아닙니다.

          ## 알려진 범위
          - ClearPass/RADIUS 서버의 동적 Role을 직접 조회하지 않습니다.
          - 모든 service object를 TCP/UDP 포트 번호까지 완전 해석하지 않습니다.
          - Streamlit 자체 사용자 인증/권한 관리와 코드서명은 현재 범위가 아닙니다.

          <details>
          <summary>세부 커밋</summary>

          비교 기준: $range

          $commitText

          </details>
          "@
          $notes = $notes -replace "(?m)^          ", ""
          $notes | Set-Content -LiteralPath $notesPath -Encoding UTF8
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create Git tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.metadata.outputs.tag }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.metadata.outputs.tag }}"

      - name: Create draft GitHub Release
        id: create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" `
            "${{ steps.assets.outputs.asset_path }}#${{ steps.metadata.outputs.asset_name }}" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "${{ steps.metadata.outputs.project_name }} ${{ steps.metadata.outputs.tag }}" `
            --notes-file "${{ steps.notes.outputs.notes_path }}" `
            --verify-tag `
            --draft

      - name: Publish GitHub Release
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.metadata.outputs.tag }}" --repo "${{ github.repository }}" --json tagName,isDraft,assets
          gh release edit "${{ steps.metadata.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --draft=false `
            --latest

      - name: Remove incomplete draft release
        if: failure() && steps.metadata.outputs.tag != '' && steps.publish_release.outcome != 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.metadata.outputs.tag }}"

          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "No draft release was deleted for $tag."
            $global:LASTEXITCODE = 0
          }

          git push origin ":refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "No remote tag was deleted for $tag."
            $global:LASTEXITCODE = 0
          }
