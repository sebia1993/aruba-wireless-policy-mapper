name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build Windows package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed." }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Project dependency installation failed." }

      - name: Run validation
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\validate.ps1

      - name: Build Windows GUI and CLI package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_gui_exe.ps1

      - name: Verify GUI and CLI package
        shell: pwsh
        run: python .\tools\verify_release_package.py --dist .\dist --smoke-cli

      - name: Build Streamlit portable package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_streamlit_portable.ps1

      - name: Verify Streamlit portable package
        shell: pwsh
        run: python .\tools\verify_streamlit_portable_package.py --dist .\dist --smoke

      - name: Build combined Windows package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_combined_release.ps1

      - name: Verify combined Windows package
        shell: pwsh
        run: python .\tools\verify_combined_release_package.py --dist .\dist --smoke
