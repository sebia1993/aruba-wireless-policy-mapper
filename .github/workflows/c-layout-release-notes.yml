name: C Layout Preview Release Notes

on:
  push:
    branches: [preview/c-layout-release-notes-20261118]

permissions:
  contents: read

jobs:
  update-notes:
    name: Correct one preview release description
    if: github.repository == 'sebia1993/aruba-wireless-policy-mapper' && github.ref == 'refs/heads/preview/c-layout-release-notes-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update C preview release notes only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c-preview-notes.md" <<'C_PREVIEW_MARKDOWN'
          # Aruba Wireless Policy Mapper — C안 시험 릴리스
          
          > **메인 병합 전 확인용 Pre-release입니다.** `main`과 기존 정식 릴리스 `v0.4.1`은 변경하지 않았습니다.
          
          ## 확인할 변경 사항
          - **Role 내부 탭형(C안)**: 기존 `주석·보고서`와 `수집 결과·통신 확인` 상단 메뉴 대신 `정책·주석` / `ACL 접근 판정` / `수집 상세` 탭 제공
          - **공통 정책 표시**: `global-sacl` ACL은 Role 주석 화면에서 기본 숨김. `공통 ACL 함께 보기`로 다시 볼 수 있으며 원본·주석·내보내기 데이터는 보존
          - **Web SSH 연결**: 신규 장비의 SSH 서버 키 SHA-256 지문을 화면에서 확인·명시적으로 승인하고 변경된 키는 차단
          - **GUI/Web 전용 배포**: CLI 실행 모드 및 CLI 전용 배포 파일 제거
          - **기존 기능 보존**: JSON 작업 파일, 이전 주석 가져오기, Excel, 원본 보고서 및 기존 Access Check 판정 범위
          
          ## 미완료·제한 사항
          - **상급자 보고용 PDF 직접 다운로드는 미완료입니다.** 이번 시험판의 PDF 기능은 기존 브라우저 인쇄 기반 방식입니다.
          - 독립 `주석 포함 HTML`에는 원본 Access Check가 포함되지 않습니다. 다른 수집본의 판정 데이터를 연결하지 않습니다.
          - Access Check는 실제 네트워크 통신 시험이 아니며, 기존 판정 범위 제한이 있습니다.
          - 사내 실제 WLC 및 사용자 Windows 환경 검증은 별도로 진행해야 합니다.
          - 이 시험판은 태그 `c-layout-preview-20261118.1`로 구분되지만, 실행 파일 내부 앱 버전은 **0.4.1**로 유지됩니다.
          
          ## 설치 및 시험
          1. 아래 `ArubaWirelessPolicyMapper_c-layout-preview-20261118.1_Windows.zip`을 다운로드하고 로컬 폴더에 압축을 풉니다.
          2. `gui/WlcRoleAclCollectorGUI.exe` 또는 `web/start_webapp.cmd`를 실행합니다.
          3. 비식별 예제 또는 실제 WLC에서 수집한 HTML 보고서를 열어 3개 내부 탭과 `global-sacl` 표시를 비교합니다.
          4. 확인 결과를 바탕으로 PR #32, PR #33의 `main` 병합 여부를 결정합니다.
          
          ## 자동 검사와 무결성
          - Python 테스트 **350개**, JavaScript 테스트 **94개** 통과 (기준 C안 개발 브랜치).
          - 본 시험 릴리스의 Windows GUI/Web/통합 ZIP 빌드·스모크 테스트, Python·JavaScript 검증 성공.
          - C안 개발 커밋: `183ccf537c47b2a1f3ddafc38bec444e1f32bf98`
          - 시험 릴리스 태그 커밋: `7e8d37762d9021951599af522effe60fdbc23a96`
          - Windows ZIP SHA-256: `1b8a0e625573e4fd8c561389ff0f323d6d27be3a01f897536350a48fa06099e4`
          - 무결성 확인용 `.sha256` 파일과 Python 의존성 SBOM을 첨부했습니다.
          
          **주의:** 기존 안정 릴리스를 대체하지 않습니다. 이번 릴리스는 사내 검증을 위한 시험판입니다.
          C_PREVIEW_MARKDOWN
          gh release edit 'c-layout-preview-20261118.1' --repo 'sebia1993/aruba-wireless-policy-mapper' --notes-file "$RUNNER_TEMP/c-preview-notes.md"
          gh release view 'c-layout-preview-20261118.1' --repo 'sebia1993/aruba-wireless-policy-mapper' --json tagName,isPrerelease,url
